<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>UNO Mobile HD</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: radial-gradient(circle, #2a085c 0%, #0d011d 100%);
            color: #fff;
            margin: 0; height: 100vh; overflow: hidden;
            display: flex; flex-direction: column; justify-content: space-between;
        }

        /* HEADER & TIMER */
        .header {
            padding: 10px 15px; display: flex; justify-content: space-between; align-items: center;
            background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .timer-badge {
            background: #ff0055; padding: 5px 12px; border-radius: 20px; font-weight: 800;
            box-shadow: 0 0 10px #ff0055; animation: pulse 1s infinite alternate;
        }
        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.08); } }

        /* BUTTONS */
        .btn {
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            color: #000; border: none; padding: 14px 28px; font-size: 18px; font-weight: 900;
            border-radius: 14px; cursor: pointer; box-shadow: 0 8px 20px rgba(79,172,254,0.4);
            transition: all 0.2s; width: 100%; max-width: 280px; margin: 10px auto; display: block;
        }
        .btn:active { transform: scale(0.95); }

        /* GAME TABLE */
        .table-area {
            position: relative; flex: 1; display: flex; justify-content: center; align-items: center; gap: 30px;
        }
        .card {
            width: 85px; height: 130px; border-radius: 12px; display: flex; flex-direction: column;
            justify-content: center; align-items: center; font-size: 28px; font-weight: 900;
            border: 3.5px solid #fff; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); position: relative;
        }
        .card.red { background: linear-gradient(135deg, #ff416c, #ff4b2b); }
        .card.blue { background: linear-gradient(135deg, #2193b0, #6dd5ed); }
        .card.green { background: linear-gradient(135deg, #11998e, #38ef7d); }
        .card.yellow { background: linear-gradient(135deg, #f80759, #bee6c7); background: #f1c40f; color: #111; }
        .card.black { background: linear-gradient(135deg, #232526, #414345); color: #ff00ff; }
        
        .card-deck {
            background: linear-gradient(135deg, #1f1c2c, #928dab); cursor: pointer;
            border: 3px dashed #00f2fe; animation: float 3s ease-in-out infinite;
        }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

        /* HAND AREA */
        .hand-area {
            display: flex; justify-content: center; align-items: flex-end; gap: -20px;
            padding: 10px; overflow-x: auto; min-height: 160px; margin-bottom: 50px;
        }
        .hand-card {
            margin-left: -25px; cursor: pointer; transform-origin: bottom center;
        }
        .hand-card:hover, .hand-card:active {
            transform: translateY(-25px) scale(1.15) !important; z-index: 99;
        }

        /* COLOR PICKER MODAL */
        .modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none;
            justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(5px);
        }
        .color-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 200px; height: 200px;
        }
        .color-box {
            border-radius: 15px; border: 3px solid #fff; cursor: pointer; transition: 0.2s;
        }
        .color-box:active { transform: scale(0.9); }

        .menu-bottom {
            position: fixed; bottom: 12px; left: 12px; z-index: 100;
        }
        .btn-exit {
            background: rgba(255, 59, 48, 0.2); border: 1px solid #ff3b30; color: #ff3b30;
            padding: 8px 16px; border-radius: 20px; font-weight: 700; cursor: pointer;
        }
        #game-screen, #lobby-screen { display: none; height: 100%; flex-direction: column; justify-content: space-between; }
    </style>
</head>
<body>

    <div id="main-menu" style="margin: auto text-align: center;">
        <h1 style="font-size: 36px; color: #00f2fe; text-shadow: 0 0 15px #00f2fe;">UNO MOBILE</h1>
        <button class="btn" onclick="startOnline()">ONLINE XONA 🌐</button>
    </div>

    <div id="lobby-screen">
        <div class="header"><h2>KUTISH XONASI</h2></div>
        <div style="text-align: center; margin: auto;">
            <div id="player-count" style="font-size: 20px; color: #00f2fe; margin-bottom: 15px;">Ulanilmoqda...</div>
            <button id="start-btn" class="btn" style="display:none;" onclick="triggerStart()">O'YINNI BOSHLAASH 🚀</button>
        </div>
    </div>

    <div id="game-screen">
        <div class="header">
            <span id="current-turn" style="font-weight: 700;">Navbat: -</span>
            <span class="timer-badge" id="timer">15</span>
        </div>

        <div class="table-area">
            <div>
                <div class="card card-deck" onclick="drawCard()">UNO</div>
                <small style="display:block; text-align:center; margin-top:5px; color:#aaa;">Paziroq</small>
            </div>
            <div>
                <div id="table-card" class="card red">7</div>
                <small style="display:block; text-align:center; margin-top:5px; color:#aaa;">Stol</small>
            </div>
        </div>

        <div>
            <div id="player-hand" class="hand-area"></div>
        </div>
    </div>

    <div class="menu-bottom">
        <button class="btn-exit" onclick="exitGame()">🚪 Chiqish</button>
    </div>

    <!-- COLOR PICKER -->
    <div id="color-modal" class="modal">
        <div class="color-grid">
            <div class="color-box" style="background:#ff416c;" onclick="pickColor('red')"></div>
            <div class="color-box" style="background:#2193b0;" onclick="pickColor('blue')"></div>
            <div class="color-box" style="background:#11998e;" onclick="pickColor('green')"></div>
            <div class="color-box" style="background:#f1c40f;" onclick="pickColor('yellow')"></div>
        </div>
    </div>

    <script>
        const Telegram = window.Telegram.WebApp;
        Telegram.ready(); Telegram.expand();

        let socket, isHost = false, myCards = [], pendingCardIdx = null;

        function vibrate() {
            if (Telegram.HapticFeedback) Telegram.HapticFeedback.impactOccurred('medium');
        }

        function renderHand() {
            const handElem = document.getElementById('player-hand');
            handElem.innerHTML = '';
            myCards.forEach((item, idx) => {
                const cardDiv = document.createElement('div');
                cardDiv.className = `card hand-card ${item.color}`;
                cardDiv.innerText = item.val;
                cardDiv.onclick = () => playCard(idx);
                handElem.appendChild(cardDiv);
            });
        }

        function playCard(index) {
            vibrate();
            const card = myCards[index];
            if (card.color === 'black') {
                pendingCardIdx = index;
                document.getElementById('color-modal').style.display = 'flex';
            } else {
                socket.emit('playCard', { cardIndex: index });
            }
        }

        function pickColor(color) {
            document.getElementById('color-modal').style.display = 'none';
            if (pendingCardIdx !== null) {
                socket.emit('playCard', { cardIndex: pendingCardIdx, chosenColor: color });
                pendingCardIdx = null;
            }
        }

        function drawCard() { vibrate(); if (socket) socket.emit('drawCard'); }

        function startOnline() {
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('lobby-screen').style.display = 'flex';

            socket = io();
            const name = Telegram.initDataUnsafe?.user?.first_name || "O'yinchi";
            socket.emit('joinRoom', name);

            socket.on('init', (data) => { isHost = data.isHost; });
            socket.on('updatePlayers', (data) => {
                document.getElementById('player-count').innerText = `O'yinchilar: ${data.count} / 4`;
                document.getElementById('start-btn').style.display = (isHost && data.count >= 2) ? 'block' : 'none';
            });

            socket.on('dealHand', (hand) => { myCards = hand; renderHand(); });
            socket.on('timerUpdate', (t) => { document.getElementById('timer').innerText = t; });

            socket.on('gameStateUpdate', (data) => {
                document.getElementById('lobby-screen').style.display = 'none';
                document.getElementById('game-screen').style.display = 'flex';

                const tc = document.getElementById('table-card');
                tc.className = `card ${data.topCard.color}`;
                tc.innerText = data.topCard.val;

                document.getElementById('current-turn').innerText = "Navbat: " + data.currentTurnPlayer;
            });

            socket.on('invalidMove', (msg) => { vibrate(); alert(msg); });
            socket.on('gameOver', (msg) => { alert(msg); location.reload(); });
        }

        function triggerStart() { if (socket) socket.emit('startGame'); }
        function exitGame() { if (confirm("Chiqasizmi?")) location.reload(); }
    </script>
</body>
</html>
