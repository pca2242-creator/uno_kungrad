<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram UNO Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #111 url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1000&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            text-align: center;
            padding: 0;
            margin: 0;
            height: 100vh;
            overflow: hidden;
        }
        .overlay {
            background: rgba(0, 0, 0, 0.75);
            width: 100%;
            height: 100%;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        h1 {
            margin: 5px 0;
            font-size: 24px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            color: #ffcc00;
        }
        .btn {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            margin: 8px auto;
            display: block;
            width: 80%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: 0.2s;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn-offline {
            background-color: #17a2b8;
        }
        .btn-start {
            background-color: #ffc107;
            color: #000;
        }
        
        /* O'YIN STOLI */
        .table-area {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin: 15px 0;
        }
        .card {
            width: 80px;
            height: 120px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: bold;
            border: 3px solid #fff;
            box-shadow: 0 5px 15px rgba(0,0,0,0.6);
            user-select: none;
        }
        .card-deck {
            background: linear-gradient(135deg, #333, #000);
            cursor: pointer;
            border: 3px dashed #ffcc00;
        }

        /* QO'LDAGI KARTALAR */
        .hand-area {
            display: flex;
            justify-content: center;
            gap: 8px;
            overflow-x: auto;
            padding: 10px 5px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 15px;
            min-height: 140px;
            align-items: center;
        }
        .hand-card {
            min-width: 65px;
            height: 100px;
            font-size: 18px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .hand-card:hover {
            transform: translateY(-10px);
        }

        /* PASTKI CHAP MENU */
        .bottom-left-menu {
            position: fixed;
            bottom: 15px;
            left: 15px;
            z-index: 100;
        }
        .menu-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status {
            font-size: 15px;
            color: #00ffcc;
            margin: 5px 0;
        }
        
        #game-screen, #lobby-screen {
            display: none;
        }
    </style>
</head>
<body>

    <div class="overlay">
        <!-- BOSH MENYU -->
        <div id="main-menu" style="margin: auto 0;">
            <h1>QOBILAN UNO GAME</h1>
            <p style="color: #ccc; font-size: 14px;">Online va Offline Rejimlar</p>
            <button class="btn" onclick="startOnline()">Online O'yin 🌐</button>
            <button class="btn btn-offline" onclick="startOffline()">Offline O'yin 🤖</button>
        </div>

        <!-- LOBBY (KUTISH XONASI) -->
        <div id="lobby-screen" style="margin: auto 0;">
            <h2>Kutish Xonasi</h2>
            <div id="player-count" class="status">Serverga ulanilmoqda...</div>
            <div id="player-color" class="status"></div>
            <button id="start-btn" class="btn btn-start" style="display: none;" onclick="triggerStart()">O'yinni boshlash 🚀</button>
        </div>

        <!-- O'YIN MAYDONI -->
        <div id="game-screen">
            <h2 id="game-status" style="font-size: 18px; margin: 0;">O'yin Ketmoqda!</h2>
            <div id="current-turn" class="status">Navbat: Aniqplanmoqda...</div>

            <!-- STOL MARKAZI -->
            <div class="table-area">
                <div>
                    <div id="deck" class="card card-deck" onclick="drawCard()">UNO</div>
                    <small>Koloda</small>
                </div>
                <div>
                    <div id="table-card" class="card" style="background-color: #ff3333;">7</div>
                    <small>Tashlangan</small>
                </div>
            </div>

            <!-- O'YINCHINING KARTALARI -->
            <div style="margin-bottom: 50px;">
                <p style="margin: 5px; font-size: 14px;">Sizning kartalaringiz:</p>
                <div id="player-hand" class="hand-area">
                    <!-- Kartalar dinamik qo'shiladi -->
                </div>
            </div>
        </div>
    </div>

    <!-- PASTKI CHAP MENYU (CHIQISH ESHIGI) -->
    <div class="bottom-left-menu">
        <button class="menu-btn" onclick="exitGame()">
            🚪 Chiqish
        </button>
    </div>

    <script>
        const Telegram = window.Telegram.WebApp;
        Telegram.ready();
        Telegram.expand();

        let socket;
        let isHost = false;

        // Boshlang'ich kartalar toplami (Sinov uchun)
        const myHand = [
            { color: 'red', val: '5' },
            { color: 'blue', val: '2' },
            { color: 'green', val: 'Skip' },
            { color: 'yellow', val: '7' },
            { color: 'red', val: '+2' }
        ];

        function renderHand() {
            const handElem = document.getElementById('player-hand');
            handElem.innerHTML = '';
            myHand.forEach((item, idx) => {
                const cardDiv = document.createElement('div');
                cardDiv.className = 'card hand-card';
                cardDiv.style.backgroundColor = item.color;
                cardDiv.innerText = item.val;
                cardDiv.onclick = () => playCard(idx);
                handElem.appendChild(cardDiv);
            });
        }

        function playCard(index) {
            const card = myHand[index];
            document.getElementById('table-card').style.backgroundColor = card.color;
            document.getElementById('table-card').innerText = card.val;
            myHand.splice(index, 1);
            renderHand();
        }

        function drawCard() {
            const colors = ['red', 'blue', 'green', 'yellow'];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            const randomVal = Math.floor(Math.random() * 9);
            myHand.push({ color: randomColor, val: randomVal.toString() });
            renderHand();
        }

        function startOnline() {
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('lobby-screen').style.display = 'block';

            socket = io();

            const name = Telegram.initDataUnsafe?.user?.first_name || "O'yinchi";
            socket.emit('joinRoom', name);

            socket.on('init', (data) => {
                isHost = data.isHost;
                document.getElementById('player-color').innerText = "Sizning rangi: " + data.color.toUpperCase();
            });

            socket.on('updatePlayers', (data) => {
                document.getElementById('player-count').innerText = "Xonadagi o'yinchilar: " + data.count + " / 4";
                
                if (isHost && data.count >= 2) {
                    document.getElementById('start-btn').style.display = 'block';
                } else {
                    document.getElementById('start-btn').style.display = 'none';
                }
            });

            socket.on('makeHost', () => {
                isHost = true;
            });

            socket.on('gameStarted', (data) => {
                document.getElementById('lobby-screen').style.display = 'none';
                document.getElementById('game-screen').style.display = 'block';
                document.getElementById('game-status').innerText = data.message;
                document.getElementById('current-turn').innerText = "O'yin boshlandi! Kartalaringizni bosing.";
                renderHand();
            });

            socket.on('full', (msg) => {
                alert(msg);
                location.reload();
            });
        }

        function triggerStart() {
            if (socket) {
                socket.emit('startGame');
            }
        }

        function startOffline() {
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            document.getElementById('game-status').innerText = "Botlarga qarshi rejim";
            document.getElementById('current-turn').innerText = "Sizning navbatingiz";
            renderHand();
        }

        function exitGame() {
            if (confirm("Rostdan ham o'yindan chiqmoqchimisiz?")) {
                location.reload();
            }
        }
    </script>
</body>
</html>
