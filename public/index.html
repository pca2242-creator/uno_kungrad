<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram UNO Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #222;
            color: #fff;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .card {
            width: 120px;
            height: 180px;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            margin: 20px auto;
            border: 4px solid #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .status {
            font-size: 18px;
            margin-top: 15px;
            color: #00ffcc;
        }
    </style>
</head>
<body>

    <h1>UNO Mini App</h1>
    <div id="player-count" class="status">Serverga ulanilmoqda...</div>
    <div id="player-color" class="status"></div>
    <div id="game-card" class="card" style="background-color: #444;">UNO</div>

    <script>
        const Telegram = window.Telegram.WebApp;
        Telegram.ready();
        Telegram.expand();

        const socket = io();

        const countElem = document.getElementById('player-count');
        const colorElem = document.getElementById('player-color');
        const cardElem = document.getElementById('game-card');

        socket.on('connect', () => {
            countElem.innerText = "Serverga muvaffaqiyatli ulandi!";
        });

        socket.on('init', (data) => {
            colorElem.innerText = "Sizning rangi: " + data.color.toUpperCase();
            cardElem.style.backgroundColor = data.color;
        });

        socket.on('updatePlayers', (count) => {
            countElem.innerText = "Xonadagi o'yinchilar: " + count + " / 4";
        });

        socket.on('full', (msg) => {
            alert(msg);
        });
    </script>
</body>
</html>
