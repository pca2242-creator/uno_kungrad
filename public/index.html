<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram UNO Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #fff;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
        }
        .btn {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px auto;
            display: block;
            width: 80%;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .btn-offline {
            background-color: #17a2b8;
        }
        .btn-start {
            background-color: #ffc107;
            color: #000;
        }
        .card {
            width: 120px;
            height: 180px;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            margin: 20px auto;
            border: 4px solid #fff;
        }
        .status {
            font-size: 16px;
            margin-top: 15px;
            color: #00ffcc;
        }
        #game-screen, #lobby-screen {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- BOSH MENYU -->
        <div id="main-menu">
            <h1>UNO Mini App</h1>
            <button class="btn" onclick="startOnline()">Online O'yin 🌐</button>
            <button class="btn btn-offline" onclick="startOffline()">Offline O'yin 🤖</button>
        </div>

        <!-- LOBBY (KUTISH XONASI) -->
        <div id="lobby-screen">
            <h2>Online Xona</h2>
            <div id="player-count" class="status">Kutilyapti...</div>
            <div id="player-color" class="status"></div>
            <button id="start-btn" class="btn btn-start" style="display: none;" onclick="triggerStart()">O'yinni boshlash 🚀</button>
        </div>

        <!-- O'YIN MAYDONI -->
        <div id="game-screen">
            <h2 id="game-status">O'yin Ketmoqda!</h2>
            <div id="game-card" class="card" style="background-color: #444;">UNO</div>
            <button class="btn btn-offline" onclick="location.reload()">Chiqish 🚪</button>
        </div>
    </div>

    <script>
        const Telegram = window.Telegram.WebApp;
        Telegram.ready();
        Telegram.expand();

        let socket;
        let isHost = false;

        function startOnline() {
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('lobby-screen').style.display = 'block';

            socket = io();

            const name = Telegram.initDataUnsafe?.user?.first_name || "O'yinchi";
            socket.emit('joinRoom', name);

            socket.on('init', (data) => {
                isHost = data.isHost;
                document.getElementById('player-color').innerText = "Sizning rangiz: " + data.color.toUpperCase();
            });

            socket.on('updatePlayers', (data) => {
                document.getElementById('player-count').innerText = "Xonadagi o'yinchilar: " + data.count + " / 4";
                
                // Kamida 2 kishi bo'lsa va 1-kirgan (Host) bo'lsa tugmani ko'rsatish
                if (isHost && data.count >= 2) {
                    document.getElementById('start-btn').style.display = 'block';
                } else {
                    document.getElementById('start-btn').style.display = 'none';
                }
            });

            socket.on('makeHost', () => {
                isHost = true;
            });

            socket.on('gameStarted', (data) => {
                document.getElementById('lobby-screen').style.display = 'none';
                document.getElementById('game-screen').style.display = 'block';
                document.getElementById('game-status').innerText = data.message;
            });

            socket.on('full', (msg) => {
                alert(msg);
                location.reload();
            });
        }

        function triggerStart() {
            if (socket) {
                socket.emit('startGame');
            }
        }

        function startOffline() {
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            document.getElementById('game-status').innerText = "Offline rejim: Botlarga qarshi o'yin boshlandi!";
        }
    </script>
</body>
</html>
