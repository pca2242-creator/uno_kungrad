<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNO Telegram Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #1c1c1e; color: white; text-align: center; margin: 0; padding: 10px; }
        .card { display: inline-block; width: 60px; height: 90px; border-radius: 8px; margin: 5px; line-height: 90px; font-weight: bold; color: white; font-size: 18px; border: 2px solid white; cursor: pointer; }
        .Red { background-color: #ff4757; }
        .Blue { background-color: #1e90ff; }
        .Green { background-color: #2ed573; }
        .Yellow { background-color: #ffa502; color: black; }
        #board { margin-top: 20px; display: none; }
        .btn { padding: 10px 20px; font-size: 16px; background: #2ed573; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <h2>UNO Mini App (4 Kishilik)</h2>
    <div id="status">Xonaga ulaninsh kutilmoqda...</div>
    <div id="player-count">O'yinchilar: 0 / 4</div>

    <div id="board">
        <h3>Navbat: <span id="turn" style="color: #ffa502;">-</span></h3>
        <p>Stoldagi karta:</p>
        <div id="top-card" class="card"></div>
        <br>
        <button class="btn" onclick="drawCard()">Karta olish (+1)</button>

        <h3>Mening kartalarim:</h3>
        <div id="my-cards"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const socket = io();
        const username = tg.initDataUnsafe?.user?.first_name || "O'yinchi_" + Math.floor(Math.random() * 1000);

        socket.emit('joinRoom', username);

        socket.on('roomUpdate', (data) => {
            document.getElementById('player-count').innerText = `O'yinchilar: ${data.count} / 4 (${data.players.join(', ')})`;
            if (data.count < 4) {
                document.getElementById('status').innerText = "4 ta o'yinchi to'planishi kutilmoqda...";
            }
        });

        socket.on('gameState', (data) => {
            document.getElementById('status').style.display = 'none';
            document.getElementById('board').style.display = 'block';

            document.getElementById('turn').innerText = data.currentTurnUser;
            
            // Stoldagi kartani yangilash
            const topCardDiv = document.getElementById('top-card');
            topCardDiv.className = `card ${data.topCard.color}`;
            topCardDiv.innerText = data.topCard.value;

            // Qo'ldagi kartalarni chizish
            const myCardsDiv = document.getElementById('my-cards');
            myCardsDiv.innerHTML = '';
            data.myCards.forEach((card, index) => {
                const cardDiv = document.createElement('div');
                cardDiv.className = `card ${card.color}`;
                cardDiv.innerText = card.value;
                cardDiv.onclick = () => socket.emit('playCard', index);
                myCardsDiv.appendChild(cardDiv);
            });
        });

        function drawCard() {
            socket.emit('drawCard');
        }

        socket.on('gameOver', (data) => {
            alert(`O'yin tugadi! G'olib: ${data.winner}`);
            location.reload();
        });

        socket.on('errorMsg', (msg) => alert(msg));
    </script>
</body>
</html>
